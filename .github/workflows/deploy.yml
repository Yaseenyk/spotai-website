name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every day at 00:17 UTC (05:47 IST). Guides go live on their own publish date (Mondays and
  # Thursdays); building daily means a delayed or dropped scheduled run is caught up the next day.
  # The odd minute avoids the busy top and half of the hour, when GitHub delays scheduled runs.
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      force_keepalive:
        description: 'Make the keep-alive commit now (to test that it can push)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned so the runner image cannot change under the schedule (ubuntu-latest is moving to 26).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # On pushes, fails early if any guide, published or scheduled, would not build on its date.
      - name: Check every scheduled guide
        if: github.event_name != 'schedule'
        run: npm run check:schedule
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000
        continue-on-error: true
      # GitHub's Pages backend sometimes accepts a deployment and never finishes it (4 Nov 2026: the same commit
      # failed four times, then published with no change). Retry once, after the first attempt has fully aborted,
      # instead of waiting for someone to re-run the job by hand.
      - name: Wait for the first attempt to finish aborting
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry the deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000

  # GitHub disables scheduled workflows in public repositories after 60 days without activity.
  # If nothing has been committed for 45 days, a scheduled run records an empty commit so the
  # schedule keeps running until the last guide is out. Pushes made with GITHUB_TOKEN do not start
  # another deploy.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit if the repository has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $age days ago."
          if [ "$age" -ge 45 ] || [ "${{ inputs.force_keepalive }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the guide schedule active"
            git push
          fi
